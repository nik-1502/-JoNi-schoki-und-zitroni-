<!DOCTYPE html>
<!-- SEITE 1: Startseite -->
<html lang="de" class="home-root">
<head>
    <meta charset="UTF-8">
    <link rel="manifest" href="manifest.webmanifest">
    <script src="app-navigation.js?v=20260927-2"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#39BCEC">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Herz in Menschenform</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=home-20260927-24">
    <link rel="apple-touch-icon" href="images/home-Icon.png">
    <script src="theme-color.js?v=20260926-9" defer></script>
    <script src="home-play-position.js?v=20260927-13"></script>
    <style>
        @media (max-width: 768px) {
            .image-wrapper button { margin-bottom: 350px !important; }
        }
    </style>
</head>
<body class="home-page">
    <button type="button" class="home-settings-button" aria-label="Einstellungen" title="Einstellungen">
        <img src="images/enstellungen/36b071ba-8621-47b5-9633-60f98277fb8d.png" alt="">
    </button>
    <button type="button" id="global-archive-btn" class="global-archive-button home-archive-button" aria-label="Archiv" title="Archiv">
        <img src="images/archiv/a823a529-0bd4-49de-ac47-d2585187c8b9.png" alt="">
    </button>
    <div class="container">
        
        <div class="dashboard">
            <div class="hero-container">
                <div class="image-wrapper">
                    <h1 aria-label="Herz in Menschenform"><img class="home-title-graphic" src="images/startseite%20%C3%BCberschrift/1992d1e1-40b9-478a-a56d-0fd1059ca60d.png" alt=""></h1>
                    <button style="padding: 0; border: none; background: none; width: 100%; display: block; margin: -1.35cm auto 80px auto; cursor: pointer;">
                        <img id="home-characters-image" src="images/startseite%20bild/c4a5dae3-a66c-4dd9-a67b-f05edfe71a5f.png" width="1536" height="1024" alt="Schoki und Zitroni" style="width: 100%; height: auto; border-radius: 0; display: block;">
                    </button>
                </div>
            </div>

            <!-- Spielen Button als Teil des Rasters -->
            <a href="play-intro.html?v=iphone15-20260927-4" id="home-play-button" class="button home-play-button" aria-label="Spielen">
                <img src="images/play%20button/0441997f-527a-40e0-8dc4-bd09bb24b520.png" width="2172" height="724" alt="">
            </a>

        </div>
    </div>
    <script>
        (() => {
            const settingsButton = document.querySelector('.home-settings-button');
            if (settingsButton) {
                settingsButton.addEventListener('click', () => {
                    document.querySelector('.home-settings-overlay')?.remove();
                    const overlay = document.createElement('div');
                    overlay.className = 'room-code-overlay home-settings-overlay';
                    const currentRoom = String(localStorage.getItem('webapp_room_key') || '').trim();
                    overlay.innerHTML = `
                        <div class="room-code-modal" role="dialog" aria-modal="true" aria-labelledby="home-settings-title">
                            <h2 id="home-settings-title">Einstellungen</h2>
                            <p>Hier kannst du den gemeinsamen Raum wechseln.</p>
                            <label class="room-code-label" for="home-room-input">Room-Code</label>
                            <input id="home-room-input" class="room-code-input" type="text" minlength="5" autocomplete="off" placeholder="Mindestens 5 Zeichen" value="${currentRoom.replace(/&/g, '&amp;').replace(/"/g, '&quot;')}">
                            <div class="room-code-error" aria-live="polite"></div>
                            <div class="home-settings-actions">
                                <button type="button" class="room-code-submit home-settings-save">Raum wechseln</button>
                                <button type="button" class="home-settings-cancel">Abbrechen</button>
                            </div>
                        </div>`;
                    const input = overlay.querySelector('#home-room-input');
                    const error = overlay.querySelector('.room-code-error');
                    overlay.querySelector('.home-settings-cancel').addEventListener('click', () => overlay.remove());
                    overlay.addEventListener('click', (event) => { if (event.target === overlay) overlay.remove(); });
                    overlay.querySelector('.home-settings-save').addEventListener('click', () => {
                        const room = input.value.trim();
                        if (room.length < 5) {
                            error.textContent = 'Bitte gib mindestens 5 Zeichen ein.';
                            input.focus();
                            return;
                        }
                        localStorage.setItem('webapp_room_key', room);
                        sessionStorage.removeItem('webapp_room_prompted_session_v1');
                        localStorage.removeItem('webapp_room_prompted_v2');
                        overlay.remove();
                    });
                    document.body.appendChild(overlay);
                    input.focus();
                });
            }

            const playButton = document.getElementById('home-play-button');
            if (playButton) {
                let navigating = false;
                const roomPromptNeeded = () => {
                    const stored = String(localStorage.getItem('webapp_room_key') || '').trim();
                    const standalone = Boolean(window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches);
                    const prompted = standalone
                        ? localStorage.getItem('webapp_room_prompted_v2') === 'true'
                        : sessionStorage.getItem('webapp_room_prompted_session_v1') === 'true';
                    return stored.length < 5 || !prompted;
                };
                const askForRoom = () => new Promise((resolve) => {
                    const overlay = document.createElement('div');
                    overlay.className = 'room-code-overlay home-room-overlay';
                    overlay.innerHTML = `
                        <div class="room-code-modal" role="dialog" aria-modal="true" aria-labelledby="home-room-title">
                            <h2 id="home-room-title">Raum wählen</h2>
                            <p>Erstelle einen neuen Raum oder tritt einem bestehenden Raum bei.</p>
                            <div class="room-code-actions">
                                <button type="button" class="room-mode-button is-active">Neuen Raum erstellen</button>
                                <button type="button" class="room-mode-button">Raum beitreten</button>
                            </div>
                            <label class="room-code-label" for="home-play-room-input">Room-Code</label>
                            <input id="home-play-room-input" class="room-code-input" type="text" minlength="5" autocomplete="off" placeholder="Mindestens 5 Zeichen">
                            <div class="room-code-error" aria-live="polite"></div>
                            <button type="button" class="room-code-submit">Weiter</button>
                        </div>`;
                    const input = overlay.querySelector('#home-play-room-input');
                    const error = overlay.querySelector('.room-code-error');
                    const finish = () => {
                        const room = input.value.trim();
                        if (room.length < 5) {
                            error.textContent = 'Bitte gib mindestens 5 Zeichen ein.';
                            input.focus();
                            return;
                        }
                        const standalone = Boolean(window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches);
                        localStorage.setItem('webapp_room_key', room);
                        if (standalone) localStorage.setItem('webapp_room_prompted_v2', 'true');
                        else sessionStorage.setItem('webapp_room_prompted_session_v1', 'true');
                        overlay.remove();
                        resolve(true);
                    };
                    overlay.querySelector('.room-code-submit').addEventListener('click', finish);
                    input.addEventListener('keydown', (event) => { if (event.key === 'Enter') finish(); });
                    overlay.addEventListener('click', (event) => {
                        if (event.target === overlay) { overlay.remove(); resolve(false); }
                    });
                    document.body.appendChild(overlay);
                    input.focus();
                });
                const openPlay = async (event) => {
                    if (navigating) return;
                    navigating = true;
                    event.preventDefault();
                    if (roomPromptNeeded()) {
                        const completed = await askForRoom();
                        if (!completed) { navigating = false; return; }
                    }
                    window.location.assign(playButton.href);
                };
                playButton.addEventListener('click', openPlay);
                playButton.addEventListener('touchend', openPlay, { passive: false });
            }

            const archiveButton = document.getElementById('global-archive-btn');
            if (!archiveButton) return;

            const readArchiveItems = () => {
                const items = [];
                const seen = new Set();
                for (let i = 0; i < localStorage.length; i += 1) {
                    const key = localStorage.key(i) || '';
                    if (!/^draw_archive(?:_stable_(?:home|daily)|_daily)?_(?:niklas|jovelyn)$/.test(key)) continue;
                    try {
                        const list = JSON.parse(localStorage.getItem(key) || '[]');
                        if (!Array.isArray(list)) continue;
                        list.forEach((item) => {
                            if (!item || !item.id || !item.dataURL || seen.has(item.id)) return;
                            seen.add(item.id);
                            items.push({ ...item, sourceKey: key });
                        });
                    } catch (_) {}
                }
                return items.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
            };

            const close = (modal) => modal?.remove();
            archiveButton.addEventListener('click', (event) => {
                event.preventDefault();
                event.stopPropagation();
                document.querySelector('.home-archive-modal')?.remove();
                const modal = document.createElement('div');
                modal.className = 'home-archive-modal';
                modal.innerHTML = `
                    <div class="home-archive-dialog" role="dialog" aria-modal="true" aria-labelledby="home-archive-title">
                        <div class="home-archive-header">
                            <h2 id="home-archive-title">Archiv</h2>
                            <button type="button" class="home-archive-close" aria-label="Archiv schließen">×</button>
                        </div>
                        <div class="home-archive-list"></div>
                    </div>`;
                const list = modal.querySelector('.home-archive-list');
                const items = readArchiveItems();
                if (!items.length) {
                    list.innerHTML = '<p class="home-archive-empty">Noch keine gespeicherten Bilder.</p>';
                } else {
                    list.innerHTML = items.map((item) => `
                        <button type="button" class="home-archive-card">
                            <img src="${item.dataURL}" alt="">
                            <span>${String(item.name || 'Bild').replace(/[&<>"']/g, (char) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]))}</span>
                        </button>`).join('');
                }
                modal.addEventListener('click', (event) => {
                    if (event.target === modal || event.target.closest('.home-archive-close')) close(modal);
                });
                document.body.appendChild(modal);
            });
        })();
    </script>
</body>
</html>
