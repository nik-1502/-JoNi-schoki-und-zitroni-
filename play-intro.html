<!DOCTYPE html>
<html lang="de" class="play-intro-root">
<head>
    <meta charset="UTF-8">
    <link rel="manifest" href="manifest.webmanifest">
    <script src="app-navigation.js?v=20260927-2"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#7471EF">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Spielen</title>
    <link rel="stylesheet" href="style.css?v=monster-menu-20260927-21">
</head>
<body class="play-intro-page">
    <a class="page-back-button" href="index.html?v=home-20260927-18" aria-label="Zurück zur Startseite">&#8249;</a>
    <img class="play-intro-background" src="images/monster%20hintergrund/himmlische_wolkenbuehne_iphone15_1179x2556.png" alt="">

    <img class="play-intro-monster" src="images/monster/e2762cc8-425d-4e20-8b0a-ccc5d8492a5c-sonnenuntergang.png" alt="Monster">

    <div class="monster-status monster-status-heart" role="img" aria-label="Herzen">
        <img class="monster-status-frame" src="images/herz%20anzeige/311b1edc-a08f-44e1-b8ad-2ae759caa252%20(1).png" alt="">
        <img class="monster-status-heart-icon" src="images/herz%20anzeige/c60f23ae-ce19-4a7e-b62e-26cde3064568.png" alt="">
        <button class="monster-status-plus" type="button" aria-label="Herzen hinzufügen">+</button>
    </div>
    <div class="monster-status monster-status-star" role="img" aria-label="Sterne">
        <img class="monster-status-frame" src="images/herz%20anzeige/311b1edc-a08f-44e1-b8ad-2ae759caa252%20(1).png" alt="">
        <img class="monster-status-star-icon" src="images/stern%20anzeige/00e72ec4-d5f3-408d-94fe-239297caf736.png" alt="">
        <button class="monster-status-plus" type="button" aria-label="Sterne hinzufügen">+</button>
    </div>

    <button class="monster-action monster-action-feed" type="button" aria-label="Füttern">
        <img class="monster-action-background" src="images/monster%20seite%20button/5ab570c9-bca5-40a3-bf0a-1363f4ce46ce.png" alt="">
        <img class="monster-action-icon monster-feed-icon" src="images/monster%20essen/fd5bf97a-7688-496d-b48c-2769b5bd1b07.png" alt="">
    </button>

    <div class="monster-play-menu" id="monster-play-menu" aria-label="Spiele auswählen">
        <a class="monster-bubble monster-bubble-quiz" href="quiz.html?v=monster-menu-20260927-1" aria-label="Quiz">
            <img src="images/button%20blase/b51903ba-2fdf-46e8-a8d5-427e4231d7dc.png" alt="">
            <span>Quiz</span>
        </a>
        <a class="monster-bubble monster-bubble-paint" href="paint.html?v=monster-menu-20260927-1" aria-label="Malen">
            <img src="images/button%20blase/b51903ba-2fdf-46e8-a8d5-427e4231d7dc.png" alt="">
            <span>Malen</span>
        </a>
    </div>

    <button class="monster-action monster-action-play" id="monster-play-toggle" type="button" aria-label="Spiele öffnen" aria-expanded="false">
        <img class="monster-action-background" src="images/monster%20seite%20button/5ab570c9-bca5-40a3-bf0a-1363f4ce46ce.png" alt="">
        <img class="monster-action-icon monster-controller-icon" src="images/controller/4644993c-f06e-4dfb-9f8d-92e22fd33b59.png" alt="">
        <span class="monster-play-close" aria-hidden="true">×</span>
    </button>
    <script>
        (() => {
            const toggle = document.getElementById('monster-play-toggle');
            const menu = document.getElementById('monster-play-menu');
            if (!toggle || !menu) return;
            toggle.addEventListener('click', () => {
                const open = document.body.classList.toggle('monster-menu-open');
                toggle.setAttribute('aria-expanded', String(open));
                toggle.setAttribute('aria-label', open ? 'Spiele schließen' : 'Spiele öffnen');
            });
        })();
    </script>
</body>
</html>
