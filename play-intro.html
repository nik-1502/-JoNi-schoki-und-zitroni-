<!DOCTYPE html>
<html lang="de" class="play-intro-root">
<head>
    <meta charset="UTF-8">
    <link rel="manifest" href="manifest.webmanifest">
    <script src="app-navigation.js?v=20260927-2"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#7471EF">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Spielen</title>
    <link rel="stylesheet" href="style.css?v=monster-menu-20260927-40">
</head>
<body class="play-intro-page">
    <a class="page-back-button" href="index.html?v=home-20260927-18" aria-label="Zurück zur Startseite">&#8249;</a>
    <img class="play-intro-background" src="images/monster%20hintergrund/himmlische_wolkenbuehne_iphone15_1179x2556.png" alt="">

    <div class="monster-time-bar" aria-label="Versorgungszeit">
        <div class="monster-time-bar-fill"></div>
    </div>

    <img class="play-intro-monster" src="images/monster/e2762cc8-425d-4e20-8b0a-ccc5d8492a5c-sonnenuntergang.png" alt="Monster">

    <div class="monster-status monster-status-heart" role="img" aria-label="Herzen">
        <img class="monster-status-frame" src="images/herz%20anzeige/311b1edc-a08f-44e1-b8ad-2ae759caa252%20(1).png" alt="">
        <img class="monster-status-heart-icon" src="images/herz%20anzeige/c60f23ae-ce19-4a7e-b62e-26cde3064568.png" alt="">
        <span class="monster-status-count">3</span>
        <button class="monster-status-plus" type="button" aria-label="Herzen hinzufügen"><span>+</span></button>
    </div>
    <div class="monster-status monster-status-star" role="img" aria-label="Sterne">
        <img class="monster-status-frame" src="images/herz%20anzeige/311b1edc-a08f-44e1-b8ad-2ae759caa252%20(1).png" alt="">
        <img class="monster-status-star-icon" src="images/stern%20anzeige/00e72ec4-d5f3-408d-94fe-239297caf736.png" alt="">
        <span class="monster-status-count">2</span>
        <button class="monster-status-plus" type="button" aria-label="Sterne hinzufügen"><span>+</span></button>
    </div>

    <button class="monster-action monster-action-feed" type="button" aria-label="Füttern">
        <img class="monster-action-background" src="images/monster%20seite%20button/5ab570c9-bca5-40a3-bf0a-1363f4ce46ce.png" alt="">
        <img class="monster-action-icon monster-feed-icon" src="images/monster%20essen/fd5bf97a-7688-496d-b48c-2769b5bd1b07.png" alt="">
    </button>

    <div class="monster-play-menu" id="monster-play-menu" aria-label="Spiele auswählen">
        <a class="monster-bubble monster-bubble-quiz" href="quiz.html?v=monster-menu-20260927-1" aria-label="Quiz">
            <img src="images/button%20blase/b51903ba-2fdf-46e8-a8d5-427e4231d7dc.png" alt="">
            <span>Quiz</span>
        </a>
        <a class="monster-bubble monster-bubble-paint" href="paint.html?v=monster-menu-20260927-1" aria-label="Malen">
            <img src="images/button%20blase/b51903ba-2fdf-46e8-a8d5-427e4231d7dc.png" alt="">
            <span>Malen</span>
        </a>
    </div>

    <button class="monster-action monster-action-play" id="monster-play-toggle" type="button" aria-label="Spiele öffnen" aria-expanded="false">
        <img class="monster-action-background" src="images/monster%20seite%20button/5ab570c9-bca5-40a3-bf0a-1363f4ce46ce.png" alt="">
        <img class="monster-action-icon monster-controller-icon" src="images/controller/4644993c-f06e-4dfb-9f8d-92e22fd33b59.png" alt="">
        <span class="monster-play-close" aria-hidden="true">×</span>
    </button>
    <script>
        (() => {
            document.querySelectorAll('.monster-action, .monster-bubble, .monster-status-plus').forEach((button) => {
                const press = () => button.classList.add('is-pressed');
                const release = () => button.classList.remove('is-pressed');
                button.addEventListener('pointerdown', press, { passive: true });
                button.addEventListener('pointerup', release, { passive: true });
                button.addEventListener('pointercancel', release, { passive: true });
                button.addEventListener('pointerleave', release, { passive: true });
                button.addEventListener('touchstart', press, { passive: true });
                button.addEventListener('touchend', release, { passive: true });
                button.addEventListener('touchcancel', release, { passive: true });
            });

            const toggle = document.getElementById('monster-play-toggle');
            const menu = document.getElementById('monster-play-menu');
            if (!toggle || !menu) return;
            toggle.addEventListener('click', () => {
                const open = document.body.classList.toggle('monster-menu-open');
                toggle.setAttribute('aria-expanded', String(open));
                toggle.setAttribute('aria-label', open ? 'Spiele schließen' : 'Spiele öffnen');
            });
        })();
    </script>
    <script>
        (() => {
            const MAX_TIME = 48 * 60 * 60 * 1000;
            const FEED_AMOUNT = 8 * 60 * 60 * 1000;
            const AFTER_HEART_LOSS = 24 * 60 * 60 * 1000;
            const INITIAL_TIME = 24 * 60 * 60 * 1000;
            const keys = {
                hearts: 'monster.hearts.v1', stars: 'monster.stars.v1', nextLoss: 'monster.nextHeartLossAt.v1', version: 'monster.state.version'
            };
            const heartCount = document.querySelector('.monster-status-heart .monster-status-count');
            const starCount = document.querySelector('.monster-status-star .monster-status-count');
            const fill = document.querySelector('.monster-time-bar-fill');
            const feedButton = document.querySelector('.monster-action-feed');
            const read = (key, fallback) => {
                const value = Number(localStorage.getItem(key));
                return Number.isFinite(value) ? value : fallback;
            };
            const isFreshState = localStorage.getItem(keys.version) !== '2';
            let hearts = Math.max(0, read(keys.hearts, 3));
            let stars = Math.max(0, read(keys.stars, 2));
            let nextLoss = read(keys.nextLoss, Date.now() + INITIAL_TIME);
            if (isFreshState) {
                hearts = 3;
                stars = 2;
                nextLoss = Date.now() + INITIAL_TIME;
                localStorage.setItem(keys.version, '2');
            }

            const persist = () => {
                localStorage.setItem(keys.hearts, String(hearts));
                localStorage.setItem(keys.stars, String(stars));
                localStorage.setItem(keys.nextLoss, String(nextLoss));
            };
            const catchUp = () => {
                let now = Date.now();
                while (now >= nextLoss) {
                    hearts = Math.max(0, hearts - 1);
                    nextLoss += AFTER_HEART_LOSS;
                }
                persist();
            };
            const update = (animate = false) => {
                const remaining = Math.max(0, nextLoss - Date.now());
                const percent = Math.min(100, remaining / MAX_TIME * 100);
                fill.style.height = `${percent}%`;
                fill.classList.toggle('is-pink', remaining < 24 * 60 * 60 * 1000 && remaining >= 16 * 60 * 60 * 1000);
                fill.classList.toggle('is-orange', remaining < 16 * 60 * 60 * 1000 && remaining >= 8 * 60 * 60 * 1000);
                fill.classList.toggle('is-red', remaining < 8 * 60 * 60 * 1000);
                fill.classList.toggle('is-purple', remaining >= 24 * 60 * 60 * 1000);
                feedButton.disabled = remaining >= 40 * 60 * 60 * 1000 || stars <= 0;
                feedButton.classList.toggle('is-disabled', feedButton.disabled);
                heartCount.textContent = hearts;
                starCount.textContent = stars;
            };
            catchUp();
            update();
            setInterval(() => { catchUp(); update(); }, 30000);
            feedButton.addEventListener('click', () => {
                const remaining = Math.max(0, nextLoss - Date.now());
                if (stars <= 0 || remaining >= 40 * 60 * 60 * 1000) return;
                stars -= 1;
                nextLoss = Date.now() + Math.min(remaining + FEED_AMOUNT, MAX_TIME);
                persist();
                update(true);
            });
        })();
    </script>
</body>
</html>
