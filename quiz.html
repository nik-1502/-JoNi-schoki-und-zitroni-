<!DOCTYPE html>
<!-- SEITE 4: Quiz -->
<html lang="de" class="quiz-root">
<head>
    <meta charset="UTF-8">
    <link rel="manifest" href="manifest.webmanifest">
    <script src="app-navigation.js?v=20260927-2"></script>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#351044">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Tägliches Quiz</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=20260926-safe-area-4">
    <link rel="apple-touch-icon" href="images/home-Icon.png">
    <script src="theme-color.js?v=20260926-9" defer></script>
</head>
<body class="quiz-page">
    <a class="page-back-button" href="games.html?v=status-20260926-1" aria-label="Zurück zur Spielen-Seite">&#8249;</a>
    <div class="container" style="justify-content: flex-start; padding-top: 60px;">
        <!-- Kompakter Tagesquiz-Header, passend zur Mal-Challenge -->
        <div class="quiz-daily-header">
            <h1>Tagesquiz</h1>
        </div>

        <div class="row" style="width: 100%; max-width: 800px; align-items: center; gap: 40px;">
            <!-- Jovelyn's Quiz Area -->
            <div class="col">
                <div class="name-button">Jovelyn</div>
                <div class="canvas-wrapper" id="quiz-wrapper-jovelyn" style="aspect-ratio: 1 / 1; height: auto;">
                    <div class="quiz-question-container" id="quiz-container-jovelyn">
                        <p class="quiz-click-text">...</p>
                    </div>
                </div>
                <span class="status-dot red quiz-status-dot" id="quiz-status-jovelyn"></span>
            </div>

            <!-- Niklas's Quiz Area -->
            <div class="col">
                <div class="name-button">Niklas</div>
                <div class="canvas-wrapper" id="quiz-wrapper-niklas" style="aspect-ratio: 1 / 1; height: auto;">
                    <div class="quiz-question-container" id="quiz-container-niklas">
                        <p class="quiz-click-text">...</p>
                    </div>
                </div>
                <span class="status-dot red quiz-status-dot" id="quiz-status-niklas"></span>
            </div>
        </div>
    </div>

    <!-- Quiz Modal -->
    <div id="quiz-modal" class="modal hidden">
        <div class="modal-content" style="aspect-ratio: 1 / 1; width: 80%; max-width: 450px; height: auto; justify-content: center;">
            <h3 id="quiz-question-text" style="margin: 0;">Frage...</h3>
            <textarea id="quiz-answer-input" class="quiz-answer-input" style="height: 100px; width: 100%; box-sizing: border-box;" placeholder="Deine Antwort..."></textarea>
            <button id="quiz-done-btn" class="control-button" style="background-color: rgb(255, 103, 0); margin: 0;">Fertig</button>
        </div>
    </div>

    <div class="controls" style="display: none;"></div>

    <script src="script.js?v=20260730-supabase2"></script>
</body>
</html>
